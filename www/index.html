<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17191c"><title>GananciaX</title>
<style>
:root{--bg:#17191c;--card:#1f2327;--card2:#292e33;--tx:#eef1f3;--mu:#98a2ab;--ok:#2fd69b;--bad:#ff7a6b;--ln:#30363c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Manrope,system-ui,sans-serif}
main{max-width:880px;margin:auto;padding:14px 14px 150px}h1{font-size:24px;margin:4px 0 12px}h2{margin:0}p{margin:6px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:5}
nav .brand{display:none}nav button{flex:1;background:0;border:0;color:var(--mu);padding:8px 0;font:inherit;font-size:11px;display:grid;gap:2px;justify-items:center;cursor:pointer}nav button.on{color:var(--ok);font-weight:700}nav button{min-width:0}nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}.off{opacity:.55}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k{color:var(--mu);font-size:12.5px}.v{font-size:21px;font-weight:800}.r{text-align:right}
.pos{color:var(--ok)}.neg{color:var(--bad)}.empty{color:var(--mu);text-align:center;padding:18px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--ln);border-radius:10px;padding:12px;width:100%;min-height:48px}
input[type=checkbox]{width:24px;min-height:24px}
.b{font:inherit;font-weight:700;color:var(--tx);background:var(--card2);border:1px solid var(--ln);border-radius:12px;padding:13px 16px;min-height:48px;cursor:pointer;width:100%}.b.p{background:var(--ok);color:#06231a;border:0}.b.d{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer}.row:last-child{border:0}
.ch{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.ch button{background:var(--card2);color:var(--mu);border:1px solid var(--ln);border-radius:20px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}.ch button.on{background:var(--ok);color:#06231a;border-color:var(--ok)}
label{display:grid;gap:4px;font-size:13px;color:var(--mu)}label.cb{display:flex;align-items:center;gap:10px;color:var(--tx)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ok);color:#06231a;border:0;border-radius:28px;padding:15px 20px;font:inherit;font-weight:800;box-shadow:0 6px 20px #0008;z-index:6;cursor:pointer}
.sheet{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>form,.sheet>div{background:var(--card);width:100%;max-width:520px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;padding:16px calc(16px) calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.err{color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;transform:translate(-50%,16px);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ok);color:#06231a;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:40;font-weight:700;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{background:var(--bad);color:#2a0a06}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
@media(min-width:800px){nav{top:0;right:auto;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--ln);justify-content:flex-start;gap:4px;padding-top:24px}nav .brand{display:block;font-size:20px;font-weight:800;padding:0 16px 16px;color:var(--ok)}nav button{grid-auto-flow:column;justify-content:start;gap:12px;font-size:14px;padding:12px 16px;border-radius:10px}main{margin-left:220px;max-width:none;padding-right:40px}.fab{bottom:24px}.sheet{align-items:center}.sheet>form,.sheet>div{border-radius:18px}}
@media(min-width:1100px){main{margin:auto;padding-left:240px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<main id="app"></main><nav id="nav" aria-label="Principal"></nav>
<button class="fab" data-a="newS" aria-label="Añadir venta">+ Venta</button><div id="sh"></div><div id="toast" class="toast" role="status"></div>
<script>
const T=['products','sales','expenses','clients'],TB={s:'sales',e:'expenses',p:'products'},S={products:[],sales:[],expenses:[],clients:[]},CAT=['Transporte','Empaques','Electricidad','Publicidad','Alquiler','Otros'];
const PM={cash:'Efectivo',yape:'Yape',plin:'Plin',transfer:'Transferencia',other:'Otro'};
let db,view='home',grp='day',cf='',ct='',selB=-1,rm=new Date().toISOString().slice(0,7),F={q:'',t:'all',prod:'all',pm:'all',from:'',to:''};
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0');
const m=n=>(n<0?'-':'')+'S/ '+Math.abs(+n).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
const ds=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const nowS=()=>{const d=new Date();return ds(d)+'T'+p2(d.getHours())+':'+p2(d.getMinutes())};
const r2=x=>Math.round((x+Number.EPSILON)*100)/100,uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={home:'M3 11l9-8 9 8M5 10v10h14V10',list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',box:'M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',chart:'M4 20V10M10 20V4M16 20v-8M22 20H2',db:'M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8'};
const ic=n=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]}"/></svg>`;
let tt;const toast=(t,bad)=>{const e=$('#toast');e.textContent=t;e.className='toast show'+(bad?' bad':'');clearTimeout(tt);tt=setTimeout(()=>e.className='toast',3200)};
/* ---- IndexedDB ---- */
const wait=r=>new Promise((ok,ko)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const st=(t,mo)=>db.transaction(t,mo).objectStore(t);
const openDB=()=>new Promise((ok,ko)=>{const r=indexedDB.open('gananciax',2);r.onupgradeneeded=()=>T.forEach(t=>{if(!r.result.objectStoreNames.contains(t))r.result.createObjectStore(t,{keyPath:'id'})});r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const save=async(t,o)=>{const i=S[t].findIndex(x=>x.id===o.id);i<0?S[t].push(o):S[t][i]=o;if(db)await wait(st(t,'readwrite').put(o))};
const rem=async(t,id)=>{S[t]=S[t].filter(x=>x.id!==id);if(db)await wait(st(t,'readwrite').delete(id))};
const replaceAll=d=>new Promise((ok,ko)=>{T.forEach(t=>S[t]=d[t]);if(!db)return ok();const tr=db.transaction(T,'readwrite');T.forEach(t=>{const s=tr.objectStore(t);s.clear();d[t].forEach(o=>s.put(o))});tr.oncomplete=ok;tr.onerror=()=>ko(tr.error)});
/* ---- Cálculos ---- */
const sc=s=>{const g=r2(s.q*s.p),n=r2(g-(s.d||0)),c=r2(s.q*s.c);return{g,n,c,pr:r2(n-c)}};
const inR=(d,a,b)=>(!a||d.slice(0,10)>=a)&&(!b||d.slice(0,10)<=b);
const stats=(a,b,sl=S.sales,el=S.expenses)=>{const o={n:0,g:0,dsc:0,inc:0,cogs:0,exp:0};sl.forEach(s=>{if(!inR(s.date,a,b))return;const c=sc(s);o.n++;o.g+=c.g;o.dsc+=s.d||0;o.inc+=c.n;o.cogs+=c.c});el.forEach(e=>{if(inR(e.date,a,b))o.exp+=+e.amt});['g','dsc','inc','cogs','exp'].forEach(k=>o[k]=r2(o[k]));o.gp=r2(o.inc-o.cogs);o.net=r2(o.gp-o.exp);return o};
const pst=p=>{const ss=S.sales.filter(s=>s.productId===p.id);return{q:ss.reduce((a,s)=>a+s.q,0),g:r2(ss.reduce((a,s)=>a+sc(s).pr,0))}};
const lines=s=>[['Ventas brutas',s.g],['Descuentos',-s.dsc],['Ingresos netos',s.inc,1],['Costo de productos vendidos',-s.cogs],['Ganancia bruta',s.gp,1],['Gastos operativos',-s.exp],['Ganancia neta estimada',s.net,1]].map(([a,v,b])=>`<div class="row" style="cursor:default"><span${b?' style="font-weight:800"':''}>${a}</span><b class="${b?(v<0?'neg':'pos'):''}">${m(v)}</b></div>`).join('');
/* ---- Listas ---- */
const feed=ff=>{const L=[],q=ff.q.trim().toLowerCase(),tx=o=>(o.desc+' '+(o.notes||'')).toLowerCase();
if(ff.t!=='e')S.sales.forEach(o=>{if((ff.prod==='all'||(ff.prod==='custom'?!o.productId:o.productId===ff.prod))&&(ff.pm==='all'||o.pm===ff.pm)&&inR(o.date,ff.from,ff.to)&&(!q||tx(o).includes(q)))L.push({k:'s',o})});
if(ff.t!=='s'&&ff.prod==='all')S.expenses.forEach(o=>{if((ff.pm==='all'||o.pm===ff.pm)&&inR(o.date,ff.from,ff.to)&&(!q||tx(o).includes(q)))L.push({k:'e',o})});
return L.sort((a,b)=>b.o.date.localeCompare(a.o.date))};
const row=({k,o})=>{const c=k==='s'?sc(o):null;return `<div class="row" data-a="edit" data-k="${k}" data-id="${o.id}" tabindex="0" role="button"><div><b>${esc(o.desc)}</b> <span class="k">${k==='s'?'×'+o.q:esc(o.cat)}</span><div class="k">${fd(o.date)}${o.date.length>10?' '+o.date.slice(11,16):''} · ${PM[o.pm]||'Sin método'}${o.demo?' · demo':''}</div></div><div class="r">${k==='s'?`<b class="pos">${m(c.n)}</b><div class="k">Ganancia ${m(c.pr)}</div>`:`<b class="neg">${m(-o.amt)}</b>`}</div></div>`};
const movList=()=>{const L=feed(F),s=stats('','',L.filter(x=>x.k==='s').map(x=>x.o),L.filter(x=>x.k==='e').map(x=>x.o));return `<div class="card"><b>Resumen de lo filtrado</b>${lines(s)}</div>`+(L.length?`<div class="card">${L.map(row).join('')}</div>`:'<div class="card empty">No hay movimientos con estos filtros.</div>')};
const pmOpts=sel=>Object.entries(PM).map(([k,l])=>`<option value="${k}"${k===sel?' selected':''}>${l}</option>`).join('');
/* ---- Gráfico ---- */
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'],dm=d=>p2(d.getDate())+'/'+p2(d.getMonth()+1);
const bks=()=>{const o=[];if(grp==='cust'){const e=new Date(ct+'T00:00');for(let d=new Date(cf+'T00:00'),i=0;d<=e&&i<93;i++,d.setDate(d.getDate()+1))o.push({l:dm(d),a:ds(d),b:ds(d)});return o}
const N={day:14,week:8,month:6}[grp];for(let i=N-1;i>=0;i--){const d=new Date();if(grp==='day'){d.setDate(d.getDate()-i);o.push({l:dm(d),a:ds(d),b:ds(d)})}else if(grp==='week'){d.setDate(d.getDate()-((d.getDay()+6)%7)-7*i);const e=new Date(d);e.setDate(e.getDate()+6);o.push({l:dm(d),a:ds(d),b:ds(e)})}else{d.setDate(1);d.setMonth(d.getMonth()-i);o.push({l:MES[d.getMonth()],a:ds(d),b:ds(new Date(d.getFullYear(),d.getMonth()+1,0))})}}return o};
const chart=()=>{if(grp==='cust'&&!(cf&&ct&&cf<=ct))return '<div class="empty">Elige las fechas desde y hasta.</div>';
const B=bks().map(x=>({...x,...stats(x.a,x.b)}));if(!B.some(x=>x.n||x.exp))return '<div class="empty">Sin movimientos en este período. Registra una venta o un gasto para ver el gráfico.</div>';
const W=600,H=210,Q=26,hi=Math.max(1,...B.flatMap(x=>[x.inc,x.exp,x.net])),lo=Math.min(0,...B.map(x=>x.net)),y=v=>H-Q-(v-lo)/(hi-lo)*(H-Q-8),z=y(0),w=(W-20)/B.length,e=Math.ceil(B.length/7);
let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Ingresos, gastos y ganancia por período"><line x1="10" x2="${W-10}" y1="${z}" y2="${z}" stroke="#3a4148"/>`;
B.forEach((x,i)=>{const cx=10+i*w,bw=Math.max(2,w*.3);s+=`<rect x="${cx+w*.15}" y="${Math.min(y(x.inc),z)}" width="${bw}" height="${Math.abs(y(x.inc)-z)}" fill="#2fd69b" rx="2"/><rect x="${cx+w*.15+bw+1}" y="${Math.min(y(x.exp),z)}" width="${bw}" height="${Math.abs(y(x.exp)-z)}" fill="#ff7a6b" rx="2"/>`;if(i%e===0)s+=`<text x="${cx+w/2}" y="${H-8}" fill="#98a2ab" font-size="11" text-anchor="middle">${x.l}</text>`});
s+=`<polyline fill="none" stroke="#f2c14e" stroke-width="2" points="${B.map((x,i)=>(10+i*w+w/2)+','+y(x.net)).join(' ')}"/>`;
B.forEach((x,i)=>s+=`<rect data-a="pick" data-i="${i}" x="${10+i*w}" y="0" width="${w}" height="${H}" fill="${i===selB?'#ffffff18':'transparent'}"/>`);
const q=B[selB];return s+`</svg><div class="k"><span class="pos">■ Ingresos</span> &nbsp;<span class="neg">■ Gastos</span> &nbsp;<span style="color:#f2c14e">■ Ganancia</span></div>`+(q?`<div style="margin-top:6px"><b>${q.a===q.b?fd(q.a):fd(q.a)+' al '+fd(q.b)}</b>: ingresos ${m(q.inc)}, gastos ${m(q.exp)}, ganancia ${m(q.net)}</div>`:'<div class="k" style="margin-top:6px">Toca una barra para ver el detalle.</div>')};
/* ---- Vistas ---- */
const home=()=>{const td=ds(new Date()),mo=td.slice(0,7),a=stats(td,td),b=stats(mo+'-01',mo+'-31'),d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);const pm=ds(d).slice(0,7),pv=stats(pm+'-01',pm+'-31'),cmp=pv.n&&pv.net?(b.net-pv.net)/Math.abs(pv.net)*100:null;
const K=(t,v,c)=>`<div class="card"><div class="k">${t}</div><div class="v ${c||''}">${v}</div></div>`,last=feed({q:'',t:'all',prod:'all',pm:'all',from:'',to:''}).slice(0,6);
return `<h1>GananciaX</h1><p class="k">Hoy, ${fd(td)}</p><div class="grid">${K('Ventas de hoy',m(a.inc))}${K('Gastos de hoy',m(a.exp),'neg')}${K('Ganancia neta de hoy',m(a.net),a.net<0?'neg':'pos')}${K('Ganancia del mes',m(b.net),b.net<0?'neg':'pos')}</div>
<div class="card"><div class="k">Número de ventas</div><div class="v">${a.n} hoy · ${b.n} en el mes</div>${cmp===null?'':`<div class="k ${cmp>=0?'pos':'neg'}">${cmp>=0?'▲':'▼'} ${Math.abs(cmp).toFixed(0)}% de ganancia neta frente al mes anterior</div>`}</div>
<div class="grid" style="margin-bottom:12px"><button class="b p" data-a="newS">Registrar venta</button><button class="b" data-a="newE">Registrar gasto</button></div>
<div class="card"><b>Ingresos, gastos y ganancia</b><div class="ch">${[['day','Día'],['week','Semana'],['month','Mes'],['cust','Rango']].map(([g,l])=>`<button data-a="grp" data-g="${g}" class="${grp===g?'on':''}">${l}</button>`).join('')}</div>${grp==='cust'?`<div class="grid" style="margin-bottom:10px"><label>Desde<input type="date" data-c="f" value="${cf}"></label><label>Hasta<input type="date" data-c="t" value="${ct}"></label></div>`:''}<div id="ch">${chart()}</div></div>
<div class="card"><b>Últimas transacciones</b>${last.length?last.map(row).join(''):'<div class="empty">Todavía no hay movimientos. Registra tu primera venta o gasto para empezar.</div>'}</div>`};
const mov=()=>`<h1>Movimientos</h1><div class="card"><input data-f="q" placeholder="Buscar por descripción" aria-label="Buscar por descripción" value="${esc(F.q)}"><div class="grid" style="margin-top:8px"><select data-f="t" aria-label="Tipo"><option value="all">Ventas y gastos</option><option value="s"${F.t==='s'?' selected':''}>Solo ventas</option><option value="e"${F.t==='e'?' selected':''}>Solo gastos</option></select><select data-f="pm" aria-label="Método de pago"><option value="all">Todos los métodos</option>${pmOpts(F.pm)}</select><select data-f="prod" aria-label="Producto" style="grid-column:1/3"><option value="all">Todos los productos</option><option value="custom"${F.prod==='custom'?' selected':''}>Descripción personalizada</option>${S.products.map(p=>`<option value="${p.id}"${F.prod===p.id?' selected':''}>${esc(p.name)}</option>`).join('')}</select><label>Desde<input type="date" data-f="from" value="${F.from}"></label><label>Hasta<input type="date" data-f="to" value="${F.to}"></label></div></div><div id="lst">${movList()}</div>`;
const prod=()=>`<h1>Productos</h1><button class="b p" data-a="newP">Nuevo producto</button><div style="height:12px"></div>`+(S.products.length?S.products.map(p=>{const x=pst(p),mg=r2(p.price-p.cost);return `<div class="card${p.active?'':' off'}" data-a="edit" data-k="p" data-id="${p.id}" tabindex="0" role="button" style="cursor:pointer"><div style="display:flex;justify-content:space-between"><b>${esc(p.name)}</b><span class="k">${esc(p.cat||'Sin categoría')}${p.active?'':' · inactivo'}${p.demo?' · demo':''}</span></div><div class="grid" style="margin-top:8px"><div><div class="k">Precio / costo</div>${m(p.price)} / ${m(p.cost)}</div><div><div class="k">Margen por unidad</div><b class="${mg<0?'neg':'pos'}">${m(mg)}${p.price?' ('+(mg/p.price*100).toFixed(0)+'%)':''}</b></div><div><div class="k">Cantidad vendida</div>${x.q}</div><div><div class="k">Ganancia acumulada</div><b class="${x.g<0?'neg':'pos'}">${m(x.g)}</b></div></div></div>`}).join(''):'<div class="card empty">Aún no tienes productos. Agrega uno con su precio y costo para calcular tu margen.</div>');
const rep=()=>`<h1>Reportes</h1><div class="card"><label>Mes del reporte<input type="month" id="rm" value="${rm}"></label><div id="rr" style="margin-top:8px">${lines(stats(rm+'-01',rm+'-31'))}</div><p class="k">La ganancia es una estimación con los datos ingresados y no sustituye una contabilidad formal. Los costos de productos se descuentan una sola vez, en la venta; los gastos operativos se restan después.</p></div><div class="card"><b>Exportar a CSV (Excel)</b><div class="grid" style="margin-top:10px"><button class="b" data-a="exp" data-id="s">Ventas</button><button class="b" data-a="exp" data-id="e">Gastos</button><button class="b" data-a="exp" data-id="p" style="grid-column:1/3">Productos</button></div></div>`;
const dat=()=>`<h1>Datos</h1><div class="card"><b>Copia de seguridad</b><p class="k">Tus datos se guardan solo en este dispositivo y no se sincronizan con otros equipos. Exporta una copia para respaldarlos o llevarlos a otro dispositivo.</p><div class="grid"><button class="b p" data-a="bak">Exportar copia (JSON)</button><button class="b" data-a="imp">Restaurar copia</button></div><input type="file" id="fi" accept=".json,application/json" hidden></div><div class="card"><b>Datos de demostración</b><p class="k">Carga ejemplos marcados como demo. Puedes borrarlos sin afectar tus datos reales.</p><div class="grid"><button class="b" data-a="demoOn">Cargar demo</button><button class="b d" data-a="demoOff">Borrar demo</button></div></div><div class="card k">Esta versión funciona como página web. La instalación como app (PWA) y el uso sin conexión no están incluidos, y no se prometen.</div>`;
/* ---- Clientes y Fiados ---- */
const cs=c=>{const t=r2(c.items.reduce((a,x)=>a+x.amt,0)),p=r2(c.pays.reduce((a,x)=>a+x.amt,0));return{t,p,d:r2(t-p)}};
const cli=()=>{const L=S.clients.map(c=>({c,...cs(c)})).sort((a,b)=>(b.d>0)-(a.d>0)||b.d-a.d||a.c.name.localeCompare(b.c.name)),tot=r2(L.reduce((a,x)=>a+Math.max(x.d,0),0)),n=L.filter(x=>x.d>0).length;
